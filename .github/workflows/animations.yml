name: Profile Animations

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: kamalSayed2004
          mode: snake
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - name: Generate Pacman
        uses: abozanona/pacman-contribution-graph@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_user_name: kamalSayed2004
      - name: Move Pacman to dist
        run: |
          mv pacman-contribution-graph.svg dist/pacman.svg
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
